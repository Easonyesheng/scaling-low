name: Scaling Low schedule diagnostic
on:
  schedule:
    - cron: '23 2 24 11 *'

permissions: {}

jobs:
  probe:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Verify the GitHub timer reached a runner
        run: |
          test "$(date -u +%F)" = 2026-11-24
          printf 'GitHub schedule reached runner at %s\n' "$(date -u +%FT%TZ)"
