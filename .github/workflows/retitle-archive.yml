name: Review archived Scaling Low headlines with DSH
'on':
  push:
    branches: [editorial/archive-headlines-20261126]
    paths: [.github/workflows/retitle-archive.yml]
permissions:
  contents: read
jobs:
  retitle:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned DSH without the API key in scope
        run: npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund --ignore-scripts --save-exact @deepseek-ai/dsh@0.2.2-rc.5
      - name: Generate archive title proposals only
        env:
          SCALINGLOW_OPENAI_API_KEY: ${{ secrets.SCALINGLOW_OPENAI_API_KEY }}
        run: python3 -B .github/scalinglow/retitle_archive.py "$RUNNER_TEMP/dsh/node_modules/.bin/dsh"
