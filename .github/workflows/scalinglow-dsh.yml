        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scalinglow-candidates-once
          path: ${{ runner.temp }}/scalinglow-candidates.cms
          if-no-files-found: error
          retention-days: 1
