name: Scaling Low DSH dry run

on:
  push:
    branches: [main]
    paths: ['.github/workflows/scalinglow-dsh.yml']

permissions:
  contents: read

concurrency:
  group: scalinglow-dsh
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned DeepSeek Harness with no credential in scope
        run: npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund --ignore-scripts --save-exact @deepseek-ai/dsh@0.2.2-rc.5
      - name: Verify DSH search and editorial output without publishing
        env:
          SCALINGLOW_OPENAI_API_KEY: ${{ secrets.SCALINGLOW_OPENAI_API_KEY }}
        run: python3 .github/scalinglow/daily.py "$RUNNER_TEMP/dsh/node_modules/.bin/dsh" news.json "$RUNNER_TEMP/scalinglow-candidates.json"

      - name: Encrypt the candidate transfer
        run: |
          cat > "$RUNNER_TEMP/scalinglow-public.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
