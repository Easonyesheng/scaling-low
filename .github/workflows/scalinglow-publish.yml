name: Scaling Low scheduled DSH publishing

'on':
  schedule:
    # Use an explicit native timezone; retain the four existing local slots.
    - cron: '17 3,9,15,21 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions: {}

concurrency:
  group: scalinglow-dsh
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the editorial and publish contract without API calls
        run: python3 -B .github/scalinglow/test_pipeline.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned DSH without the API key in scope
        run: npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund --ignore-scripts --save-exact @deepseek-ai/dsh@0.2.2-rc.5
      - name: Generate DSH candidates with official-feed date and URL checks
        env:
          SCALINGLOW_OPENAI_API_KEY: ${{ secrets.SCALINGLOW_OPENAI_API_KEY }}
        run: python3 .github/scalinglow/daily.py "$RUNNER_TEMP/dsh/node_modules/.bin/dsh" news.json "$RUNNER_TEMP/scalinglow-candidates.json"
      - id: inspect
        run: |
          test -s "$RUNNER_TEMP/scalinglow-candidates.json"
          ready="$(jq -r '(.entries | length) > 0' "$RUNNER_TEMP/scalinglow-candidates.json")"
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
      - name: Transfer only verified items to isolated publishing job
        if: steps.inspect.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scalinglow-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/scalinglow-candidates.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.generate.outputs.ready == 'true'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scalinglow-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/scalinglow-verified
      - id: append
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          publisher="$GITHUB_WORKSPACE/.github/scalinglow/publish.py"
          payload="$RUNNER_TEMP/scalinglow-verified/scalinglow-candidates.json"
          wt="$RUNNER_TEMP/scalinglow-live-main"
          result="$RUNNER_TEMP/scalinglow-append-outputs"
          for attempt in 1 2; do
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            base="$(git rev-parse refs/remotes/origin/main)"
            if ! git merge-base --is-ancestor "$SOURCE_SHA" "$base"; then
              echo '::error::Generation commit is no longer in main history.'
              exit 1
            fi
            git worktree add --detach "$wt" "$base"
            : > "$result"
            python3 "$publisher" "$wt/news.json" "$payload" "$result"
            if git -C "$wt" diff --quiet -- news.json; then
              echo 'changed=no' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C "$wt" add -- news.json
            git -C "$wt" diff --cached --check
            test "$(git -C "$wt" diff --cached --name-only)" = 'news.json'
            git -C "$wt" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish source-verified DSH AI risk briefs'
            if git -C "$wt" push origin HEAD:refs/heads/main; then
              echo 'changed=yes' >> "$GITHUB_OUTPUT"
              cat "$result" >> "$GITHUB_OUTPUT"
              git -C "$wt" rev-parse HEAD > "$RUNNER_TEMP/scalinglow-published-sha"
              exit 0
            fi
            git worktree remove "$wt"
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if [[ "$(git rev-parse refs/remotes/origin/main)" == "$base" ]]; then
              echo '::error::Push failed without a concurrent update; check branch permissions or transport.'
              exit 1
            fi
            echo 'main advanced; rechecking duplicates without invoking DSH again.'
          done
          echo '::error::main advanced twice; no unsafe overwrite attempted.'
          exit 1
      - name: Explicitly dispatch the existing GitHub Pages deployment
        if: steps.append.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Confirm the live website contains the new article IDs
        if: steps.append.outputs.changed == 'yes'
        env:
          PUBLISHED_IDS: ${{ steps.append.outputs.published_ids }}
        run: |
          set -euo pipefail
          want="$PUBLISHED_IDS"
          for i in {1..16}; do
            if curl -fsS --max-time 8 "https://scalinglow.com/news.json?run=${GITHUB_RUN_ID}-${i}" |
                jq -e --argjson want "$want" '[.entries[].id] as $live | ($want - $live | length) == 0' >/dev/null; then
              echo "Live website verified for commit $(cat "$RUNNER_TEMP/scalinglow-published-sha")"
              exit 0
            fi
            sleep 15
          done
          echo 'Published to main but the website did not confirm within the deployment window.' >&2
          exit 1
